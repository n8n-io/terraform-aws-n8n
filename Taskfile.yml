# https://taskfile.dev
#
# Wraps the local validation loop documented in AGENTS.md so contributors
# don't need to hand-type the module-root + per-example matrix. CI runs the
# same underlying commands directly (see .github/workflows/terraform-tests.yml);
# this file is a convenience wrapper, not a CI dependency.
version: "3"

vars:
  # Must stay in lockstep with the `target:` matrix lists in
  # .github/workflows/terraform-tests.yml (validate, test, tflint and the
  # per-example terraform-docs steps all enumerate the same set). This list
  # sat at six entries while the four customer-managed examples were added,
  # which made `task ci` pass locally on a change that broke
  # examples/customer-managed-everything in CI: an example this wrapper never
  # visited was, in practice, an example nobody validated before pushing.
  EXAMPLES: small medium large cloudflare godaddy split-ingress customer-managed-redis customer-managed-s3 customer-managed-cluster customer-managed-everything

env:
  # The veksh/godaddy-dns provider requires credentials even in plan-time tests.
  GODADDY_API_KEY: stub
  GODADDY_API_SECRET: stub

tasks:
  init:
    internal: true
    run: once
    cmds:
      - terraform init -backend=false
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform init -backend=false

  fmt:
    desc: Check Terraform formatting across the module and all examples.
    cmds:
      - terraform fmt -check -recursive

  validate:
    desc: terraform init + validate for the module root and every example.
    deps: [init]
    cmds:
      - terraform validate
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform validate

  test:
    desc: terraform test (plan-time, mocked providers) for the module root and every example.
    deps: [init]
    cmds:
      - terraform test -verbose
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform test -verbose

  lint:
    desc: tflint for the module root and every example.
    deps: [init]
    cmds:
      - tflint --init
      - tflint --format compact
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && tflint --init && tflint --format compact

  checkov:
    desc: >-
      Static analysis, the same invocation CI runs. Requires the exact checkov
      version CHECKOV_VERSION pins in .github/workflows/terraform-tests.yml;
      the script refuses to run against any other, because which checks apply
      is version-dependent. Install with
      `pip install "checkov==<pinned version>"`.
    cmds:
      - ./tests/scripts/check-checkov.sh

  banners:
    desc: >-
      Check every variable/output block in variables.tf and outputs.tf sits under
      a "# ── Section ──" banner (see AGENTS.md). Local-only for now, not yet a
      CI-gated check.
    cmds:
      - ./scripts/check-variable-banners.sh

  docs:
    desc: Check README.md is not stale relative to variables.tf/outputs.tf (module root and every example).
    cmds:
      - terraform-docs --output-check .
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform-docs --output-check .

  docs-generate:
    desc: Regenerate README.md from variables.tf/outputs.tf (module root and every example).
    cmds:
      - terraform-docs .
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform-docs .

  markdown:
    desc: markdownlint against README.md, docs/*.md, CONTRIBUTING.md, and AGENTS.md (not CHANGELOG.md/ROADMAP.md/SECURITY.md; not CI-gated; see .markdownlint.jsonc).
    cmds:
      - markdownlint README.md CONTRIBUTING.md AGENTS.md docs/*.md

  ci:
    desc: >-
      Run the full local loop (fmt, validate, test, lint, banners, docs, markdown).
      Mirrors every CI job except checkov, which is a hard-fail gate in CI but is
      left out here because it needs a pinned checkov install that the other tasks
      do not: run `task checkov` separately once you have it. Also runs banners and
      markdown, which CI does not gate on at all.
    cmds:
      - task: fmt
      - task: validate
      - task: test
      - task: lint
      - task: banners
      - task: docs
      - task: markdown
